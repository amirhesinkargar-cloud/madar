<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مدار | MADAR</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap');

:root {
  --bg:#f3f5f9;
  --panel:#ffffff;
  --text:#202536;
  --muted:#8b93a5;
  --border:#edf0f5;
  --primary:#7657e8;
  --primary-light:#f0edff;
  --message:#7657e8;
  --other:#f0f2f7;
}

* {
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body {
  font-family:'Vazirmatn',sans-serif;
  background:var(--bg);
  color:var(--text);
  height:100vh;
  overflow:hidden;
}

.app {
  display:flex;
  height:100vh;
  padding:14px;
  gap:14px;
}

.sidebar {
  width:340px;
  min-width:300px;
  background:var(--panel);
  border-radius:20px;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  border:1px solid var(--border);
}

.brand {
  padding:24px 22px;
  display:flex;
  align-items:center;
  gap:12px;
}

.logo {
  width:48px;
  height:48px;
  background:linear-gradient(135deg,#9678ff,#6444df);
  color:white;
  border-radius:15px;
  display:grid;
  place-items:center;
  font-size:25px;
  font-weight:800;
  box-shadow:0 5px 15px #7657e833;
}

.brand h1 {
  font-size:23px;
  font-weight:800;
}

.brand small {
  display:block;
  color:var(--muted);
  font-size:11px;
  letter-spacing:3px;
}

.search {
  margin:0 17px 15px;
  position:relative;
}

.search input {
  width:100%;
  padding:13px 43px 13px 12px;
  border:1px solid var(--border);
  border-radius:12px;
  background:var(--bg);
  outline:none;
  font-family:inherit;
  font-size:13px;
}

.search span {
  position:absolute;
  right:14px;
  top:11px;
  font-size:17px;
}

.section-title {
  padding:12px 20px;
  display:flex;
  justify-content:space-between;
  color:var(--muted);
  font-size:12px;
}

.new-chat {
  border:0;
  background:var(--primary-light);
  color:var(--primary);
  padding:7px 12px;
  border-radius:9px;
  font-family:inherit;
  cursor:pointer;
}

.chat-list {
  flex:1;
  overflow-y:auto;
}

.chat-item {
  display:flex;
  align-items:center;
  padding:13px 16px;
  gap:12px;
  cursor:pointer;
  transition:.2s;
}

.chat-item:hover,
.chat-item.active {
  background:var(--primary-light);
}

.avatar {
  width:49px;
  height:49px;
  min-width:49px;
  border-radius:16px;
  display:grid;
  place-items:center;
  font-size:19px;
  font-weight:700;
  color:white;
  background:linear-gradient(135deg,#9c83ff,#6748d9);
}

.chat-info {
  flex:1;
  min-width:0;
}

.chat-info strong {
  display:block;
  font-size:14px;
  margin-bottom:5px;
}

.chat-info p {
  font-size:12px;
  color:var(--muted);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.chat-time {
  font-size:10px;
  color:var(--muted);
}

.sidebar-footer {
  border-top:1px solid var(--border);
  padding:15px;
  display:flex;
  align-items:center;
  gap:12px;
}

.sidebar-footer .avatar {
  width:42px;
  height:42px;
  min-width:42px;
  border-radius:50%;
}

.user-info {
  flex:1;
}

.user-info strong {
  font-size:13px;
}

.user-info p {
  color:var(--muted);
  font-size:11px;
}

.icon-btn {
  border:0;
  background:transparent;
  font-size:20px;
  cursor:pointer;
  color:var(--muted);
}

.main {
  flex:1;
  background:var(--panel);
  border-radius:20px;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  border:1px solid var(--border);
  min-width:0;
}

.chat-header {
  padding:15px 22px;
  display:flex;
  align-items:center;
  gap:12px;
  border-bottom:1px solid var(--border);
  min-height:80px;
}

.chat-header .avatar {
  width:45px;
  height:45px;
  min-width:45px;
  border-radius:14px;
}

.header-info {
  flex:1;
}

.header-info strong {
  font-size:15px;
}

.header-info p {
  font-size:11px;
  color:#21b77a;
  margin-top:4px;
}

.header-actions {
  display:flex;
  gap:18px;
}

.header-actions button {
  background:none;
  border:0;
  font-size:20px;
  cursor:pointer;
}

.messages {
  flex:1;
  padding:25px;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:16px;
}

.date {
  align-self:center;
  font-size:11px;
  color:var(--muted);
  background:var(--bg);
  padding:7px 15px;
  border-radius:20px;
}

.message {
  max-width:75%;
  display:flex;
  flex-direction:column;
  gap:5px;
}

.message.mine {
  align-self:flex-start;
}

.message.theirs {
  align-self:flex-end;
}

.bubble {
  padding:12px 16px;
  border-radius:16px;
  font-size:13px;
  line-height:2;
  overflow-wrap:anywhere;
}

.mine .bubble {
  background:var(--message);
  color:white;
  border-bottom-left-radius:4px;
}

.theirs .bubble {
  background:var(--other);
  color:var(--text);
  border-bottom-right-radius:4px;
}

.message small {
  color:var(--muted);
  font-size:10px;
}

.composer {
  padding:17px 20px;
  border-top:1px solid var(--border);
  display:flex;
  align-items:center;
  gap:12px;
}

.composer input {
  flex:1;
  border:0;
  outline:none;
  background:var(--bg);
  border-radius:14px;
  padding:15px;
  font-family:inherit;
  font-size:13px;
  min-width:0;
}

.send {
  width:48px;
  height:48px;
  border:0;
  border-radius:15px;
  color:white;
  background:var(--primary);
  font-size:20px;
  cursor:pointer;
}

.send:hover {
  opacity:.85;
}

.empty {
  margin:auto;
  text-align:center;
  color:var(--muted);
}

.empty div {
  font-size:55px;
  margin-bottom:15px;
}

.empty h2 {
  color:var(--text);
  font-size:21px;
  margin-bottom:8px;
}

.mobile-back {
  display:none;
}

body.dark {
  --bg:#151722;
  --panel:#202331;
  --text:#f3f4fa;
  --muted:#9ca2b3;
  --border:#303446;
  --primary:#9277ff;
  --primary-light:#302b49;
  --other:#303446;
}

@media(max-width:700px) {
  .app {
    padding:0;
    gap:0;
  }

  .sidebar {
    width:100%;
    min-width:0;
    border-radius:0;
    border:0;
  }

  .main {
    display:none;
    position:absolute;
    inset:0;
    border-radius:0;
    border:0;
  }

  body.chat-open .sidebar {
    display:none;
  }

  body.chat-open .main {
    display:flex;
  }

  .mobile-back {
    display:block;
  }

  .messages {
    padding:18px 13px;
  }

  .chat-header {
    padding:12px;
  }

  .composer {
    padding:12px;
  }
}

.filters{display:flex;gap:6px;padding:0 14px 10px;overflow-x:auto}.filter{border:1px solid var(--border);background:var(--bg);color:var(--muted);border-radius:20px;padding:6px 11px;font:inherit;font-size:11px;white-space:nowrap;cursor:pointer}.filter.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.quick-actions{display:flex;gap:6px;padding:0 14px 10px;flex-wrap:wrap}.quick-actions button{border:0;background:var(--primary-light);color:var(--primary);border-radius:9px;padding:7px 9px;font:inherit;font-size:11px;cursor:pointer}
.modal{display:none;position:fixed;inset:0;background:#10182799;z-index:50;align-items:center;justify-content:center;padding:16px}.modal.open{display:flex}.modal-card{width:min(100%,430px);max-height:90vh;overflow:auto;background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:18px;padding:22px;position:relative;box-shadow:0 20px 60px #0003}.modal-card h2{font-size:19px;margin:4px 0 18px}.modal-close{position:absolute;left:14px;top:12px;border:0;background:transparent;color:var(--muted);font-size:25px;cursor:pointer}.modal-card label{display:block;font-size:12px;color:var(--muted);margin:12px 0}.modal-card input,.modal-card textarea{display:block;width:100%;margin-top:6px;border:1px solid var(--border);border-radius:10px;padding:11px;background:var(--bg);color:var(--text);font:inherit;outline:none}.modal-card .check-label{display:flex;align-items:center;gap:8px}.modal-card .check-label input{width:auto;margin:0}.modal-actions{display:flex;gap:9px;margin-top:16px}.primary-btn,.quiet-btn{border:0;border-radius:10px;padding:11px 16px;font:inherit;cursor:pointer}.primary-btn{background:var(--primary);color:#fff}.quiet-btn{background:var(--bg);color:var(--text)}.modal-note{font-size:12px;line-height:1.8;color:var(--muted);margin-top:10px}.chat-kind{font-size:10px;color:var(--primary);margin-top:3px}
@media(max-width:700px){.filters{padding-top:2px}.quick-actions{padding-bottom:8px}.sidebar-footer{padding:10px}}

</style>
</head>

<body>

<div class="app">

<aside class="sidebar">

  <div class="brand">
    <div class="logo">م</div>
    <div>
      <h1>مدار</h1>
      <small>MADAR MESSENGER</small>
    </div>
  </div>

  <div class="search">
    <span>⌕</span>
    <input id="search" placeholder="جست‌وجوی گفتگو...">
  </div>

  <div class="section-title">
    <span>گفتگوهای شما</span>
    <button class="new-chat" onclick="newChat()">+ گفتگوی جدید</button>
  </div>

  <div class="filters" id="chatFilters">
    <button class="filter active" data-filter="all">همه</button>
    <button class="filter" data-filter="private">خصوصی</button>
    <button class="filter" data-filter="group">گروه‌ها</button>
    <button class="filter" data-filter="channel">کانال‌ها</button>
  </div>
  <div class="quick-actions">
    <button type="button" id="createGroupBtn">＋ گروه جدید</button>
    <button type="button" id="createChannelBtn">＋ کانال جدید</button>
    <button type="button" id="profileBtn">پروفایل من</button>
  </div>
  <div class="chat-list" id="chatList"></div>

  <div class="sidebar-footer">
    <div class="avatar">م</div>
    <div class="user-info">
      <strong>کاربر مدار</strong>
      <p>حساب آزمایشی</p>
    </div>
    <button class="icon-btn" onclick="toggleDark()">◐</button>
  </div>

</aside>

<main class="main">

  <div class="chat-header" id="chatHeader">
    <div class="empty">
      <div>🪐</div>
      <h2>به مدار خوش آمدی</h2>
      <p>یک گفتگو انتخاب کن و شروع کن.</p>
    </div>
  </div>

  <div class="messages" id="messages">
    <div class="empty">
      <div>💬</div>
      <h2>مدار؛ دنیای ارتباطات</h2>
      <p>گفتگوی خودت را انتخاب کن.</p>
    </div>
  </div>

  <form class="composer" id="sendForm">
    <input id="messageInput" placeholder="پیامت را بنویس..." autocomplete="off">
    <button class="send" type="submit">➤</button>
  </form>

</main>

</div>

<div class="modal" id="profileModal" aria-hidden="true"><div class="modal-card"><button class="modal-close" data-close="profileModal">×</button><h2>پروفایل من</h2><label>نام نمایشی<input id="profileDisplay" maxlength="50"></label><label>نام کاربری<input id="profileUsername" maxlength="20" dir="ltr"></label><label>درباره من<textarea id="profileBio" maxlength="180" rows="3"></textarea></label><label>نشانی عکس پروفایل<input id="profileAvatar" type="url" placeholder="https://..."></label><div class="modal-actions"><button id="saveProfileBtn" class="primary-btn">ذخیره تغییرات</button><button id="signOutBtn" class="quiet-btn">خروج از حساب</button></div><p class="modal-note" id="profileNotice"></p></div></div>
<div class="modal" id="createModal" aria-hidden="true"><div class="modal-card"><button class="modal-close" data-close="createModal">×</button><h2 id="createTitle">ساخت گفتگو</h2><label>نام<input id="createName" maxlength="60" required></label><label id="createDescriptionWrap">توضیحات<textarea id="createDescription" maxlength="250" rows="3"></textarea></label><label id="createPublicWrap" class="check-label"><input id="createPublic" type="checkbox"> عمومی باشد (همه کاربران عضو شوند)</label><label id="createMembersWrap">نام کاربری اعضا (با ویرگول جدا کن)<input id="createMembers" placeholder="username1, username2" dir="ltr"></label><div class="modal-actions"><button id="createSubmitBtn" class="primary-btn">ایجاد</button></div><p class="modal-note" id="createNotice"></p></div></div>

<script type="module">
import { supabase } from './supabase.js';

let currentUser = null;
let chats = [];
let activeChat = null;
let realtimeChannel = null;
let activeFilter = "all";
let createMode = "group";
let myProfile = null;

const chatList = document.getElementById('chatList');
const messages = document.getElementById('messages');
const chatHeader = document.getElementById('chatHeader');
const sendForm = document.getElementById('sendForm');
const messageInput = document.getElementById('messageInput');

function showError(message) {
  alert(message);
}

function formatTime(value) {
  if (!value) return '';
  return new Date(value).toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit' });
}

function initials(name) {
  return (name || '?').trim().charAt(0) || '?';
}

function getChatName(chat) {
  return chat.otherProfile?.display_name || chat.otherProfile?.username || chat.title || 'گفتگو';
}

function renderChats() {
  const query = document.getElementById('search').value.trim().toLowerCase();
  chatList.innerHTML = '';

  const filtered = chats.filter(chat => { const kind = chat.kind || (chat.is_group ? 'group' : 'private'); const matchesFilter = activeFilter === 'all' || kind === activeFilter; return matchesFilter && (getChatName(chat).toLowerCase().includes(query) || (chat.otherProfile?.username || '').toLowerCase().includes(query)); });

  if (!filtered.length) {
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.style.padding = '25px 12px';
    empty.textContent = chats.length ? 'گفتگویی پیدا نشد.' : 'هنوز گفتگویی نداری؛ از «گفتگوی جدید» شروع کن.';
    chatList.appendChild(empty);
    return;
  }

  filtered.forEach(chat => {
    const last = chat.lastMessage;
    const item = document.createElement('div');
    item.className = 'chat-item ' + (activeChat === chat.id ? 'active' : '');
    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = initials(getChatName(chat));
    const info = document.createElement('div');
    info.className = 'chat-info';
    const strong = document.createElement('strong');
    strong.textContent = getChatName(chat);
    const preview = document.createElement('p');
    preview.textContent = last ? last.content : (chat.kind==='channel'?'کانال':'شروع گفتگو');
    const time = document.createElement('span');
    time.className = 'chat-time';
    time.textContent = last ? formatTime(last.created_at) : '';
    info.append(strong, preview);
    item.append(avatar, info, time);
    item.addEventListener('click', () => openChat(chat.id));
    chatList.appendChild(item);
  });
}

function renderMessages() {
  const chat = chats.find(item => item.id === activeChat);
  messages.innerHTML = '';
  if (!chat) {
    messages.innerHTML = '<div class="empty"><div>💬</div><h2>مدار؛ دنیای ارتباطات</h2><p>یک گفتگو را انتخاب کن.</p></div>';
    return;
  }
  const date = document.createElement('div');
  date.className = 'date';
  date.textContent = 'گفتگوی شما در مدار';
  messages.appendChild(date);

  chat.messages.forEach(message => {
    const row = document.createElement('div');
    row.className = 'message ' + (message.sender_id === currentUser.id ? 'mine' : 'theirs');
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = message.content;
    const time = document.createElement('small');
    time.textContent = formatTime(message.created_at);
    row.append(bubble, time);
    messages.appendChild(row);
  });
  messages.scrollTop = messages.scrollHeight;
}

async function loadMessages(conversationId) {
  const { data, error } = await supabase
    .from('messages')
    .select('id, conversation_id, sender_id, content, created_at')
    .eq('conversation_id', conversationId)
    .order('created_at', { ascending: true });
  if (error) throw error;
  const chat = chats.find(item => item.id === conversationId);
  if (chat) {
    chat.messages = data || [];
    chat.lastMessage = chat.messages[chat.messages.length - 1] || null;
  }
  renderMessages();
  renderChats();
}

async function openChat(id) {
  activeChat = id;
  document.body.classList.add('chat-open');
  const chat = chats.find(item => item.id === id);
  if (!chat) return;

  chatHeader.innerHTML = `
    <button class="icon-btn mobile-back" id="mobileBack" type="button">→</button>
    <div class="avatar" id="headerAvatar"></div>
    <div class="header-info"><strong id="headerName"></strong><p>گفتگوی خصوصی در مدار</p></div>
    <div class="header-actions"><button id="darkHeader" type="button">◐</button><button id="infoHeader" type="button">ⓘ</button></div>`;
  chatHeader.querySelector('#headerAvatar').textContent = initials(getChatName(chat));
  chatHeader.querySelector('#headerName').textContent = getChatName(chat);
  chatHeader.querySelector('#mobileBack').addEventListener('click', back);
  chatHeader.querySelector('#darkHeader').addEventListener('click', toggleDark);
  chatHeader.querySelector('#infoHeader').addEventListener('click', showInfo);

  if (realtimeChannel) {
    await supabase.removeChannel(realtimeChannel);
    realtimeChannel = null;
  }
  try {
    await loadMessages(id);
    realtimeChannel = supabase
      .channel('messages-' + id)
      .on('postgres_changes', {
        event: 'INSERT', schema: 'public', table: 'messages',
        filter: 'conversation_id=eq.' + id
      }, async payload => {
        const existing = chats.find(item => item.id === id)?.messages || [];
        if (!existing.some(message => message.id === payload.new.id)) {
          await loadMessages(id);
        }
      })
      .subscribe();
  } catch (error) {
    console.error(error);
    showError('گفتگو بارگذاری نشد. بررسی کن جدول‌ها و دسترسی‌های دیتابیس درست باشند.\n' + error.message);
  }
  renderChats();
}

async function loadChats() {
  const { data: memberships, error: membershipError } = await supabase
    .from('conversation_members')
    .select('conversation_id')
    .eq('user_id', currentUser.id);
  if (membershipError) throw membershipError;

  const ids = [...new Set((memberships || []).map(row => row.conversation_id))];
  chats = [];
  if (!ids.length) {
    renderChats();
    renderMessages();
    return;
  }

  const { data: conversations, error: conversationError } = await supabase
    .from('conversations')
    .select('id, title, kind, description, avatar_url, is_public, is_group, created_by, created_at')
    .in('id', ids)
    .order('created_at', { ascending: false });
  if (conversationError) throw conversationError;

  for (const conversation of (conversations || [])) {
    const { data: members, error: membersError } = await supabase
      .from('conversation_members')
      .select('user_id')
      .eq('conversation_id', conversation.id);
    if (membersError) throw membersError;
    const otherMember = (members || []).find(member => member.user_id !== currentUser.id);
    let otherProfile = null;
    if (otherMember) {
      const { data: profile, error: profileError } = await supabase
        .from('profiles')
        .select('id, username, display_name, avatar_url')
        .eq('id', otherMember.user_id)
        .maybeSingle();
      if (profileError) throw profileError;
      otherProfile = profile;
    }
    chats.push({ ...conversation, otherProfile, messages: [], lastMessage: null });
  }

  for (const chat of chats) {
    const { data: latest, error: latestError } = await supabase
      .from('messages')
      .select('id, conversation_id, sender_id, content, created_at')
      .eq('conversation_id', chat.id)
      .order('created_at', { ascending: false })
      .limit(1);
    if (latestError) throw latestError;
    chat.lastMessage = latest?.[0] || null;
  }
  renderChats();
  renderMessages();
}

async function newChat() {
  const raw = prompt('نام کاربری مخاطب را وارد کن:');
  if (!raw || !raw.trim()) return;
  const username = raw.trim().replace(/^@/, '').toLowerCase();
  if (username === (currentUser.user_metadata?.username || '').toLowerCase()) {
    showError('نمی‌توانی با خودت گفتگو بسازی.');
    return;
  }

  try {
    const { data: profile, error: profileError } = await supabase
      .from('profiles')
      .select('id, username, display_name, avatar_url')
      .eq('username', username)
      .maybeSingle();
    if (profileError) throw profileError;
    if (!profile) {
      showError('این نام کاربری پیدا نشد. ابتدا مخاطبت باید در مدار ثبت‌نام کرده باشد و پروفایل داشته باشد.');
      return;
    }
    if (profile.id === currentUser.id) {
      showError('نمی‌توانی با خودت گفتگو بسازی.');
      return;
    }

    const { data: myMemberships, error: myMembershipError } = await supabase
      .from('conversation_members')
      .select('conversation_id')
      .eq('user_id', currentUser.id);
    if (myMembershipError) throw myMembershipError;

    let existingId = null;
    for (const membership of (myMemberships || [])) {
      const { data: members, error: membersError } = await supabase
        .from('conversation_members')
        .select('user_id')
        .eq('conversation_id', membership.conversation_id);
      if (membersError) throw membersError;
      const ids = (members || []).map(member => member.user_id).sort();
      if (ids.length === 2 && ids.includes(currentUser.id) && ids.includes(profile.id)) {
        existingId = membership.conversation_id;
        break;
      }
    }

    if (existingId) {
      await loadChats();
      await openChat(existingId);
      return;
    }

    const { data: conversation, error: createError } = await supabase
      .from('conversations')
      .insert({ created_by: currentUser.id, is_group: false })
      .select('id, title, kind, description, avatar_url, is_public, is_group, created_by, created_at')
      .single();
    if (createError) throw createError;

    const { error: memberError } = await supabase.from('conversation_members').insert([
      { conversation_id: conversation.id, user_id: currentUser.id },
      { conversation_id: conversation.id, user_id: profile.id }
    ]);
    if (memberError) throw memberError;

    await loadChats();
    await openChat(conversation.id);
  } catch (error) {
    console.error(error);
    showError('ساخت گفتگو ناموفق بود.\n' + error.message);
  }
}


function openModal(id){document.getElementById(id).classList.add('open');document.getElementById(id).setAttribute('aria-hidden','false');}
function closeModal(id){document.getElementById(id).classList.remove('open');document.getElementById(id).setAttribute('aria-hidden','true');}
document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>closeModal(b.dataset.close)));
document.querySelectorAll('.modal').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)closeModal(m.id)}));
document.querySelectorAll('.filter').forEach(b=>b.addEventListener('click',()=>{activeFilter=b.dataset.filter;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));renderChats()}));
document.getElementById('profileBtn').addEventListener('click',()=>{document.getElementById('profileDisplay').value=myProfile?.display_name||'';document.getElementById('profileUsername').value=myProfile?.username||'';document.getElementById('profileBio').value=myProfile?.bio||'';document.getElementById('profileAvatar').value=myProfile?.avatar_url||'';document.getElementById('profileNotice').textContent='';openModal('profileModal')});
document.getElementById('saveProfileBtn').addEventListener('click',async()=>{const notice=document.getElementById('profileNotice');const username=document.getElementById('profileUsername').value.trim().toLowerCase();const display_name=document.getElementById('profileDisplay').value.trim();const bio=document.getElementById('profileBio').value.trim();const avatar_url=document.getElementById('profileAvatar').value.trim();if(!/^[a-z0-9_]{3,20}$/.test(username)){notice.textContent='نام کاربری باید ۳ تا ۲۰ حرف انگلیسی، عدد یا زیرخط باشد.';return}if(!display_name){notice.textContent='نام نمایشی را وارد کن.';return}const btn=document.getElementById('saveProfileBtn');btn.disabled=true;try{const {data,error}=await supabase.from('profiles').upsert({id:currentUser.id,username,display_name,bio,avatar_url},{onConflict:'id'}).select().single();if(error)throw error;myProfile=data;document.querySelector('.sidebar-footer .user-info strong').textContent=display_name;document.querySelector('.sidebar-footer .user-info p').textContent='@'+username;document.querySelector('.sidebar-footer .avatar').textContent=initials(display_name);notice.textContent='پروفایل ذخیره شد.';}catch(e){notice.textContent='ذخیره نشد: '+e.message;}finally{btn.disabled=false}});
document.getElementById('signOutBtn').addEventListener('click',async()=>{if(!confirm('از حساب مدار خارج می‌شوی؟'))return;const {error}=await supabase.auth.signOut();if(error){alert(error.message);return}location.replace('./login.html')});
function showCreate(mode){createMode=mode;document.getElementById('createTitle').textContent=mode==='group'?'ساخت گروه جدید':'ساخت کانال جدید';document.getElementById('createName').value='';document.getElementById('createDescription').value='';document.getElementById('createMembers').value='';document.getElementById('createPublic').checked=mode==='channel';document.getElementById('createDescriptionWrap').style.display=mode==='channel'?'block':'block';document.getElementById('createPublicWrap').style.display=mode==='channel'?'flex':'none';document.getElementById('createMembersWrap').style.display=mode==='group'?'block':'none';document.getElementById('createNotice').textContent='';openModal('createModal')}
document.getElementById('createGroupBtn').addEventListener('click',()=>showCreate('group'));
document.getElementById('createChannelBtn').addEventListener('click',()=>showCreate('channel'));
document.getElementById('createSubmitBtn').addEventListener('click',async()=>{const notice=document.getElementById('createNotice');const title=document.getElementById('createName').value.trim();const description=document.getElementById('createDescription').value.trim();if(!title){notice.textContent='نام را وارد کن.';return}const btn=document.getElementById('createSubmitBtn');btn.disabled=true;try{const kind=createMode;const is_public=kind==='channel'&&document.getElementById('createPublic').checked;const {data:conv,error}=await supabase.from('conversations').insert({created_by:currentUser.id,title,description,kind,is_group:kind==='group',is_public}).select('id').single();if(error)throw error;const members=[{conversation_id:conv.id,user_id:currentUser.id,role:'owner'}];if(kind==='group'){const names=[...new Set(document.getElementById('createMembers').value.split(',').map(x=>x.trim().replace(/^@/,'').toLowerCase()).filter(Boolean))];if(names.length){const {data:profiles,error:pe}=await supabase.from('profiles').select('id,username').in('username',names);if(pe)throw pe;const found=new Set((profiles||[]).map(p=>p.username.toLowerCase()));const missing=names.filter(n=>!found.has(n));if(missing.length)throw new Error('این نام‌های کاربری پیدا نشدند: '+missing.join(', '));for(const p of profiles||[])if(p.id!==currentUser.id)members.push({conversation_id:conv.id,user_id:p.id,role:'member'})}}const {error:me}=await supabase.from('conversation_members').insert(members);if(me)throw me;closeModal('createModal');await loadChats();await openChat(conv.id);}catch(e){notice.textContent='ساخت انجام نشد: '+e.message;}finally{btn.disabled=false}});

sendForm.addEventListener('submit', async event => {
  event.preventDefault();
  const content = messageInput.value.trim();
  if (!content || !activeChat) return;
  const chat = chats.find(item => item.id === activeChat);
  if (!chat) return;
  messageInput.disabled = true;
  try {
    const { error } = await supabase.from('messages').insert({
      conversation_id: activeChat,
      sender_id: currentUser.id,
      content
    });
    if (error) throw error;
    messageInput.value = '';
    await loadMessages(activeChat);
  } catch (error) {
    console.error(error);
    showError('پیام ارسال نشد.\n' + error.message);
  } finally {
    messageInput.disabled = false;
    messageInput.focus();
  }
});

function toggleDark() {
  document.body.classList.toggle('dark');
  localStorage.setItem('madar_dark', document.body.classList.contains('dark'));
}
function back() { document.body.classList.remove('chat-open'); }
function showInfo() { alert('مدار | MADAR\nپیام‌رسان خصوصی'); }

// توابعی که در HTML با onclick صدا زده می‌شوند باید روی window باشند.
window.newChat = newChat;
window.toggleDark = toggleDark;
window.back = back;
window.showInfo = showInfo;

document.getElementById('search').addEventListener('input', renderChats);
if (localStorage.getItem('madar_dark') === 'true') document.body.classList.add('dark');

async function startApp() {
  const { data: { session }, error } = await supabase.auth.getSession();
  if (error) throw error;
  if (!session) {
    location.replace('./login.html');
    return;
  }
  currentUser = session.user;
  const { data: profile, error: profileError } = await supabase
    .from('profiles')
    .select('id, username, display_name, avatar_url, bio')
    .eq('id', currentUser.id)
    .maybeSingle();
  if (profileError) throw profileError;
  myProfile = profile || {};
  const displayName = profile?.display_name || profile?.username || currentUser.email || 'کاربر مدار';
  document.querySelector('.sidebar-footer .user-info strong').textContent = displayName;
  document.querySelector('.sidebar-footer .user-info p').textContent = profile?.username ? '@' + profile.username : 'حساب مدار';
  document.querySelector('.sidebar-footer .avatar').textContent = initials(displayName);
  await loadChats();
}

startApp().catch(error => {
  console.error(error);
  showError('مدار نتوانست اطلاعات را بارگذاری کند.\n' + error.message);
});
