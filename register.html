<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ثبت‌نام | مدار</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #101827;
      color: white;
      font-family: Tahoma, sans-serif;
      padding: 20px;
    }
    .box {
      width: 100%;
      max-width: 400px;
      background: #1c293b;
      padding: 30px;
      border-radius: 18px;
    }
    h1, p { text-align: center; }
    p { color: #aab7ca; }
    input, button {
      width: 100%;
      padding: 14px;
      margin-top: 14px;
      border-radius: 9px;
      font-size: 15px;
    }
    input {
      background: #101827;
      border: 1px solid #39485d;
      color: white;
    }
    button {
      border: none;
      background: #3985ff;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }
    #message {
      line-height: 2;
      text-align: center;
      font-size: 13px;
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>مدار</h1>
    <p>ساخت حساب کاربری جدید</p>

    <form id="registerForm">
      <input id="username" placeholder="نام کاربری" required minlength="3">
      <input id="displayName" placeholder="نام نمایشی" required>
      <input id="email" type="email" placeholder="ایمیل" required>
      <input id="password" type="password"
        placeholder="رمز عبور (حداقل ۸ کاراکتر)"
        required minlength="8">
      <button id="submitBtn" type="submit">ثبت‌نام</button>
    </form>

    <div id="message"></div>
    <p>قبلاً حساب ساخته‌ای؟ <a href="./login.html">وارد شو</a></p>
  </div>

  <script type="module">
    import { supabase } from './supabase.js';

    const form = document.getElementById('registerForm');
    const message = document.getElementById('message');
    const button = document.getElementById('submitBtn');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      const username = document.getElementById('username').value.trim().toLowerCase();
      const displayName = document.getElementById('displayName').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!/^[a-z0-9_]{3,20}$/.test(username)) {
        message.textContent = 'نام کاربری باید ۳ تا ۲۰ حرف انگلیسی، عدد یا زیرخط باشد.';
        return;
      }

      button.disabled = true;
      message.textContent = 'در حال ساخت حساب...';

      try {
      const { data, error } = await supabase.auth.signUp({
  email,
  password,
  options: {
    emailRedirectTo: 'https://amirhesinkargar-cloud.github.io/madar/',
    data: {
      username,
      display_name: displayName
    }
  }
});

        if (error) throw error;

        if (data.session) {
          message.textContent = 'حساب ساخته شد؛ در حال انتقال...';
          location.href = './index.html';
          return;
        }

        if (data.user && data.user.identities?.length === 0) {
          throw new Error('این ایمیل قبلاً ثبت‌نام کرده است.');
        }

        location.href = './verify.html?email=' + encodeURIComponent(email);

      } catch (error) {
        message.textContent = 'خطا: ' + error.message;
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
