<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تأیید حساب | مدار</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #101827;
      color: white;
      font-family: Tahoma, sans-serif;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 400px;
      background: #1c293b;
      padding: 30px;
      border-radius: 18px;
      text-align: center;
    }

    input, button {
      width: 100%;
      padding: 15px;
      margin-top: 18px;
      border-radius: 9px;
      font-size: 17px;
    }

    input {
      background: #101827;
      border: 1px solid #39485d;
      color: white;
      text-align: center;
      letter-spacing: 8px;
    }

    button {
      background: #3985ff;
      border: none;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    button:disabled { opacity: .6; }

    #message {
      margin-top: 18px;
      line-height: 2;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>مدار</h1>
    <h3>تأیید حساب کاربری</h3>

    <p>کد شش‌رقمی ارسال‌شده به ایمیلت را وارد کن.</p>

    <input
      id="code"
      type="text"
      inputmode="numeric"
      maxlength="6"
      placeholder="------"
      autocomplete="one-time-code"
      required
    >

    <button id="verifyBtn">تأیید و ورود</button>

    <div id="message"></div>
  </div>

  <script type="module">
    import { supabase } from './supabase.js';

    const email = new URLSearchParams(location.search).get('email');
    const codeInput = document.getElementById('code');
    const button = document.getElementById('verifyBtn');
    const message = document.getElementById('message');

    if (!email) {
      message.textContent = 'ایمیل پیدا نشد. دوباره ثبت‌نام کن.';
      button.disabled = true;
    }

    button.addEventListener('click', async () => {
      const token = codeInput.value.trim();

      if (!/^\d{6}$/.test(token)) {
        message.textContent = 'کد باید شش رقم باشد.';
        return;
      }

      button.disabled = true;
      message.textContent = 'در حال بررسی کد...';

      try {
        const { data, error } = await supabase.auth.verifyOtp({
          email,
          token,
          type: 'signup'
        });

        if (error) throw error;

        const user = data.user;

        if (!user) throw new Error('اطلاعات حساب دریافت نشد.');

        const { error: profileError } = await supabase
          .from('profiles')
          .upsert({
            id: user.id,
            username: user.user_metadata.username,
            display_name: user.user_metadata.display_name
          });

        if (profileError) throw profileError;

        message.textContent = 'حساب شما با موفقیت تأیید شد!';

        setTimeout(() => {
          location.href = './index.html';
        }, 1500);

      } catch (error) {
        message.textContent = 'خطا: ' + error.message;
        button.disabled = false;
      }
    });
  </script>

</body>
</html>
